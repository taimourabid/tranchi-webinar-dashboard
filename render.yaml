services:
  - type: web
    name: webinar-dashboard
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: webinar-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false   # Set this manually in Render dashboard
      - key: WEBHOOK_SECRET
        sync: false   # Set this manually in Render dashboard
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: webinar-db
    databaseName: webinar_dashboard
    plan: free
