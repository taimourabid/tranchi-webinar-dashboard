<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tranchi Webinar Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #060610;
    --card:     rgba(255,255,255,0.04);
    --border:   rgba(255,255,255,0.08);
    --text:     #f0f0f8;
    --muted:    rgba(255,255,255,0.45);
    --accent:   #7c3aed;
    --accent2:  #06b6d4;
    --danger:   #ef4444;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .mesh {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 20%, rgba(124,58,237,0.18) 0%, transparent 70%),
      radial-gradient(ellipse 60% 80% at 80% 80%, rgba(6,182,212,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 50% 40% at 60% 10%, rgba(124,58,237,0.08) 0%, transparent 60%);
  }

  .card {
    position: relative; z-index: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 44px;
    width: 100%;
    max-width: 420px;
    backdrop-filter: blur(20px);
    box-shadow: 0 32px 80px rgba(0,0,0,0.5);
  }

  .logo {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 12px;
    margin-bottom: 28px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; letter-spacing: -0.5px;
  }

  h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  p  { color: var(--muted); font-size: 14px; margin-bottom: 32px; }

  label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 8px; color: var(--muted); }

  input[type=password] {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 16px;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type=password]:focus { border-color: var(--accent); }

  button {
    width: 100%;
    margin-top: 20px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s;
  }
  button:hover { opacity: 0.9; transform: translateY(-1px); }
  button:active { transform: translateY(0); }

  .error {
    margin-top: 16px;
    color: var(--danger);
    font-size: 13px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="mesh"></div>
<div class="card">
  <div class="logo">T</div>
  <h1>Tranchi Webinar</h1>
  <p>Sign in to access the performance dashboard</p>
  <form method="POST" action="/login">
    <label>Password</label>
    <input type="password" name="password" autofocus autocomplete="current-password" placeholder="Enter admin password">
    <button type="submit">Sign in</button>
  </form>
  <script>
    if (location.search.includes('error=1')) {
      document.body.insertAdjacentHTML('beforeend', '<p class="error" style="position:fixed;bottom:32px;left:50%;transform:translateX(-50%)">Incorrect password. Try again.</p>');
    }
  </script>
</div>
</body>
</html>
